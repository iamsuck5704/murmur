name: Android - emulator startup smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-smoke.yml'
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Run offline regression tests
        run: |
          npm run build:web
          npm run test:release
          npm run test:individual
          npm run test:smoke-config
      - name: Generate Android app
        run: |
          npx cap add android
          npx cap sync android
          python3 scripts/patch_android.py
          python3 scripts/patch_android_release.py
          python3 scripts/set-native-version.py android
      - name: Compile and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            cd ..
            bash scripts/android-smoke.sh
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Murmur-Android-emulator-smoke-report
          path: build-reports/android-smoke.txt
          if-no-files-found: warn
